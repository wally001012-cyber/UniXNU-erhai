name: erhai XNU (OnePlus Pad 2 Pro)

on:
  workflow_dispatch:
    inputs:
      steps:
        description: "unixnu build steps"
        type: choice
        options: [kernel-payload, kernel-payload-bootimg]
        default: kernel-payload

# Note: GitHub's `shell: bash` already runs
# /bin/bash --noprofile --norc -e -o pipefail (visible in the run #2/#3 logs),
# so a failed unixnu inside a tee pipeline does fail the step. No PIPEFLAGS
# override is needed; the earlier one was a no-op.

permissions:
  contents: read

concurrency:
  group: erhai-xnu-${{ github.ref }}
  cancel-in-progress: false

env:
  # The per-unit platform seed. `unique-chip-id` and `chip-id` produce
  # IOPlatformUUID; without the seed a process calling gethostuuid() with a
  # zero timeout waits forever, which looks like a dead kernel.
  # board.toml carries unique_chip_id = "required", so payload.py refuses to
  # build when this is empty rather than silently emitting a seedless ADT.
  UNIXNU_UNIQUE_CHIP_ID: ${{ secrets.UNIXNU_UNIQUE_CHIP_ID }}

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 360
    defaults:
      run:
        shell: bash
        working-directory: device
    steps:
      - name: Check out the erhai configuration
        uses: actions/checkout@v4
        with:
          path: device
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Prepare the isolated UniXNU source and check the board
        run: |
          set -euo pipefail
          python3 scripts/test-upstream.py
          TREE=$(./unixnu --prepare)
          echo "UNIXNU_TREE=$TREE" >> "$GITHUB_ENV"
          python3 "$TREE/scripts/test-kernel-source.py"
          python3 "$TREE/scripts/test-bootimg.py"
          # The whole ADT contract, not two hand-picked cases: run #2 and #3
          # failed here because only test_tree_contract/test_invalid_window
          # were selected and the rest had never executed.
          python3 scripts/test-adt.py
          python3 "$TREE/drivers/DarwinBoot/Test/test-adt.py"
          cc -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined \
            -I "$TREE/drivers/DarwinBoot/DarwinBootPkg/Driver" \
            drivers/BootProgress/Test/console.c -o /tmp/boot-progress-test
          ASAN_OPTIONS=detect_leaks=0 /tmp/boot-progress-test

      - name: Check the board configuration before burning runner time
        run: |
          set -euo pipefail
          python3 scripts/check-board.py
          # Prove the checker actually rejects bad boards, not just prints OK.
          python3 scripts/test-check-board.py

      - name: Install host tools and check the SDK
        run: |
          set -euo pipefail
          brew install cmake ninja unifdef llvm mtools
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path
          df -h .

      - name: Fetch the kernel sources
        run: |
          set -euo pipefail
          mkdir -p out/erhai/logs
          ./unixnu defconfig erhai_defconfig
          ./unixnu fetch xnu libplatform libdispatch AvailabilityVersions libpthread corecrypto-2023 IOStorageFamily 2>&1 \
            | tee out/erhai/logs/actions-fetch.log
          cp unixnu.lock out/erhai/unixnu.lock

      - name: Build the kernel with the Apple kexts prelinked, then the payload
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # Per-unit platform seed. `unique-chip-id` and `chip-id` produce
          # IOPlatformUUID; without the seed a process calling gethostuuid()
          # with a zero timeout waits forever, which looks like a dead kernel.
        run: |
          set -euo pipefail
          ./unixnu build ${{ inputs.steps }} -j 3 2>&1 | tee out/erhai/logs/actions-build.log

      - name: Report what the payload actually carries
        if: always()
        run: |
          set -euo pipefail
          python3 scripts/report-payload.py out/erhai || true

      - name: Check the native panic argument path
        if: success()
        run: |
          set -euo pipefail
          python3 drivers/BootProgress/Test/panic-entry.py out/erhai/tree/.cache/xnu-work \
            --font "$UNIXNU_TREE/drivers/DarwinBoot/DarwinBootPkg/Driver"

      - name: Upload the kernel, payload and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: erhai-xnu-${{ github.run_number }}
          path: |
            device/out/erhai/kernel/**
            device/out/erhai/payload/**
            device/out/erhai/logs/**
            device/out/erhai/unixnu.lock
            device/out/erhai/report/**
          if-no-files-found: warn
          retention-days: 7
